# Data paths
data:
  raw_path: data/raw
  processed_path: data/processed
  output_path: data/outputs
  database: data/processed/cert.duckdb
  # Oversample session-level insider sessions in test to reach target positive rate (use with --oversample)
  oversample_target_positive_rate: 0.1  # e.g. 0.1 = 10% insider sessions in test after oversample

# Feature engineering
features:
  sequence_length: 100  # Max events per session
  feature_dim: 32       # Features per event
  # Role features: none | roles (42 one-hot) | units (6 one-hot from role_units.yaml)
  role_features: none
  role_mapping_file: config/role_units.yaml  # Used when role_features: units

# Model architecture
model:
  type: lstm  # lstm | paper_lstm | transformer
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.4  # Matched hardcoded default

  # Paper LSTM (matches reference paper: unidirectional, RepeatVector, 32->16->32)
  paper_lstm_bottleneck: 16
  paper_lstm_enc_hidden: 32   # First encoder hidden (paper uses 32); omit to use feature_dim

  # Transformer-specific
  num_heads: 8
  ff_dim: 512   # Matched hardcoded default

# Training
training:
  batch_size: 512
  epochs: 200
  learning_rate: 5.0e-5  # Better val generalization than 0.0001
  weight_decay: 1.0e-5   # L2 regularization for better validation loss
  warmup_epochs: 5       # Linear LR warm-up (then ReduceLROnPlateau)
  # Weighted loss (hard mining): focus on top-k% hardest samples per batch (training only)
  weighted_loss: none    # none | hard_mining
  hard_mining_ratio: 0.1 # Top 10% hardest samples when weighted_loss: hard_mining
  patience: 200  # Early stopping
  train_split: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  seed: 42

# Evaluation
evaluation:
  threshold_method: f1_optimal  # f1_optimal or percentile
  percentile: 95
