# Data paths
data:
  raw_path: data/raw
  processed_path: data/processed
  output_path: data/outputs
  database: data/processed/cert.duckdb

# Feature engineering
features:
  sequence_length: 100  # Max events per session
  feature_dim: 32       # Features per event

# Model architecture
model:
  type: lstm  # lstm or transformer
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3
  
  # Transformer-specific
  num_heads: 8
  ff_dim: 1024

# Training
training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  patience: 10  # Early stopping
  train_split: 0.8
  seed: 42

# Evaluation
evaluation:
  threshold_method: f1_optimal  # f1_optimal or percentile
  percentile: 95
